<!-- ============ FONTES DO TEMA (substituir pelo bloco de temas.md) ============ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ============ TOKENS — substituir pelo :root do tema escolhido ============ */
:root{
  --bg:#F7F7F5;  --bg-2:#EFEFEC;  --surface:#FFFFFF;
  --ink:#14161A;  --ink-2:#4A4F57;  --ink-3:#82888F;
  --line:#DDDDD6;  --line-strong:#C2C2B9;
  --accent:#1B4DFF;  --accent-ink:#FFFFFF;  --accent-soft:#E8EDFF;
  --ok:#1B7F4B;  --warn:#B4740F;  --bad:#B32020;
  --font-display:'Inter Tight',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --radius:4px;  --radius-lg:6px;
  --shadow:none;
  --border:1px solid var(--line);

  /* escala tipográfica — comum a todos os temas */
  --t-hero:clamp(2.4rem,7vw,4.4rem);
  --t-h2:clamp(1.75rem,4.4vw,2.8rem);
  --t-h3:clamp(1.15rem,2.2vw,1.4rem);
  --t-body:clamp(.98rem,1.6vw,1.06rem);
  --t-sm:.875rem;
  --t-label:.6875rem;

  /* ritmo vertical — três densidades, use alternadamente */
  --pad-tight:clamp(2.5rem,6vw,3.5rem);
  --pad-base:clamp(3.5rem,9vw,6rem);
  --pad-air:clamp(5rem,13vw,9rem);

  --maxw:1140px;
  --maxw-text:62ch;
}

/* ============ RESET ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:var(--t-body);line-height:1.62;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
img,svg,video{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
ul,ol{list-style:none}
table{border-collapse:collapse;width:100%}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ============ TIPOGRAFIA ============ */
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;line-height:1.08;letter-spacing:-.02em}
h1{font-size:var(--t-hero);font-weight:800;letter-spacing:-.035em}
h2{font-size:var(--t-h2);letter-spacing:-.028em}
h3{font-size:var(--t-h3);letter-spacing:-.015em}
p{max-width:var(--maxw-text)}
strong,b{font-weight:600;color:var(--ink)}
.lead{font-size:clamp(1.05rem,2.1vw,1.22rem);color:var(--ink-2);line-height:1.55}
.sm{font-size:var(--t-sm);color:var(--ink-2)}
.xs{font-size:.8125rem;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;word-spacing:-.28em}

/* eyebrow: o marcador de seção numerado */
.eyebrow{
  font-family:var(--font-mono);font-size:var(--t-label);font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  display:flex;align-items:center;gap:.6rem;margin-bottom:1.25rem;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line);max-width:120px}
.eyebrow .n{color:var(--accent)}

/* ============ LAYOUT ============ */
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:clamp(1.15rem,5vw,2rem)}
section{padding-block:var(--pad-base)}
section.tight{padding-block:var(--pad-tight)}
section.air{padding-block:var(--pad-air)}
section.alt{background:var(--bg-2)}
section.dark{background:var(--ink);color:var(--bg)}
section.dark h1,section.dark h2,section.dark h3{color:var(--bg)}
section.dark .sm,section.dark .lead{color:color-mix(in srgb,var(--bg) 70%,transparent)}
section.dark .eyebrow{color:color-mix(in srgb,var(--bg) 55%,transparent)}
section.dark .eyebrow::after{background:color-mix(in srgb,var(--bg) 20%,transparent)}
section.dark .card{background:color-mix(in srgb,var(--bg) 5%,transparent);border-color:color-mix(in srgb,var(--bg) 15%,transparent)}

.rule{height:1px;background:var(--line);border:0}

/* grids — use assimetria, não repita a mesma em seções seguidas */
.grid{display:grid;gap:1px;background:var(--line);border:var(--border)}
.grid > *{background:var(--bg);padding:clamp(1.25rem,3vw,1.75rem)}
.g2{grid-template-columns:1fr}
.g3{grid-template-columns:1fr}
.g4{grid-template-columns:1fr 1fr}
.cols{display:grid;gap:clamp(1.5rem,4vw,2.5rem);grid-template-columns:1fr}
.split{display:grid;gap:clamp(1.75rem,5vw,3.5rem);grid-template-columns:1fr;align-items:start}
.stack{display:flex;flex-direction:column;gap:1rem}
.row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}

@media (min-width:900px){
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  .cols{grid-template-columns:1fr 1fr}
  .split{grid-template-columns:7fr 5fr}       /* assimétrico por padrão */
  .split.rev{grid-template-columns:5fr 7fr}
  .split.wide{grid-template-columns:8fr 4fr}
  .sticky{position:sticky;top:2rem}
}

/* ============ SUPERFÍCIES ============ */
.card{background:var(--surface);border:var(--border);border-radius:var(--radius);padding:clamp(1.25rem,3vw,1.75rem)}
.card.flush{padding:0;overflow:hidden}
.card.hi{border-color:var(--accent)}
.panel{background:var(--bg-2);border:var(--border);border-radius:var(--radius);padding:clamp(1.25rem,3vw,1.75rem)}
.ph{background:var(--bg-2);border:1px dashed var(--line-strong);border-radius:var(--radius);display:grid;place-items:center;color:var(--ink-3);font-family:var(--font-mono);font-size:var(--t-label);letter-spacing:.1em;text-transform:uppercase;aspect-ratio:16/10}

/* ============ COMPONENTES ============ */
.tag{
  display:inline-flex;align-items:center;gap:.4rem;
  font-family:var(--font-mono);font-size:var(--t-label);font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;
  border:var(--border);border-radius:100px;padding:.32rem .7rem;color:var(--ink-2);
}
.tag.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  background:var(--accent);color:var(--accent-ink);
  font-family:var(--font-display);font-weight:600;font-size:1rem;letter-spacing:-.01em;
  padding:1rem 1.6rem;border-radius:var(--radius);
  transition:transform .12s ease,filter .12s ease;text-align:center;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.btn.lg{padding:1.15rem 2rem;font-size:1.06rem}

/* lista densa — substitui os "3 cards com ícone" */
.list{display:grid;gap:0;border-top:var(--border)}
.list li{display:flex;gap:.85rem;padding:.9rem 0;border-bottom:var(--border);align-items:flex-start}
.list li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none;margin-top:.62rem}
.list.neg li::before{background:none;content:"×";width:auto;height:auto;color:var(--bad);font-weight:600;margin-top:-.08rem;line-height:1.6}
.list.check li::before{background:none;content:"→";width:auto;height:auto;color:var(--accent);font-weight:600;margin-top:-.02rem;line-height:1.6}

/* tabela comparativa */
.tbl th,.tbl td{text-align:left;padding:.85rem 1rem;border-bottom:var(--border);font-size:var(--t-sm)}
.tbl th{font-family:var(--font-mono);font-size:var(--t-label);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.tbl td.n{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.tbl tr.hi td{background:var(--accent-soft)}

/* acordeão FAQ */
.acc{border-top:var(--border)}
.acc details{border-bottom:var(--border)}
.acc summary{
  display:flex;gap:1rem;align-items:flex-start;padding:1.15rem 0;cursor:pointer;list-style:none;
  font-family:var(--font-display);font-weight:600;font-size:1.02rem;letter-spacing:-.01em;
}
.acc summary::-webkit-details-marker{display:none}
.acc summary .q{font-family:var(--font-mono);font-size:var(--t-label);color:var(--ink-3);padding-top:.3rem;flex:none;letter-spacing:.08em}
.acc summary::after{content:"+";margin-left:auto;color:var(--ink-3);font-weight:400;font-size:1.3rem;line-height:1;flex:none}
.acc details[open] summary::after{content:"–"}
.acc .a{padding:0 0 1.3rem 2.6rem;color:var(--ink-2);font-size:var(--t-sm);max-width:64ch}

/* barra fixa de CTA (mobile) */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--surface);border-top:var(--border);
  padding:.7rem clamp(1rem,4vw,1.5rem);
  display:flex;gap:.85rem;align-items:center;justify-content:space-between;
  transform:translateY(110%);transition:transform .25s ease;
  box-shadow:0 -8px 24px rgba(0,0,0,.06);
}
.bar.show{transform:translateY(0)}
@media (max-width:899px){body{padding-bottom:4.75rem}}
.bar .btn{padding:.8rem 1.2rem;font-size:.94rem;white-space:nowrap}
@media (min-width:900px){.bar{display:none}}

/* reveal no scroll — discreto, sem exagero */
.rv{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .rv{opacity:1;transform:none;transition:none}
  html{scroll-behavior:auto}
}

/* utilitários pontuais */
.center{text-align:center}
.center p{margin-inline:auto}
.mt-s{margin-top:.75rem}.mt{margin-top:1.5rem}.mt-l{margin-top:2.5rem}.mt-xl{margin-top:4rem}
.full{grid-column:1/-1}
.hide-m{display:none}
@media (min-width:900px){.hide-m{display:block}.hide-d{display:none}}
</style>
</head>
<body>

<!-- ============ SEÇÕES ENTRAM AQUI (ver references/blocos.md) ============ -->

<main>
  <!-- HERO -->
  <!-- SEÇÕES DE ARGUMENTO -->
  <!-- PROVA VISUAL -->
  <!-- OFERTA -->
  <!-- FAQ -->
</main>

<footer style="border-top:var(--border);padding-block:2.5rem">
  <div class="wrap stack">
    <p class="xs">{{RAZAO_SOCIAL}} · CNPJ {{CNPJ}} · Todos os direitos reservados.</p>
    <p class="xs" style="max-width:70ch">{{DISCLAIMER}}</p>
  </div>
</footer>

<!-- barra fixa de CTA no mobile -->
<div class="bar" id="bar">
  <div class="stack" style="gap:.1rem">
    <span class="xs">{{ANCORA_PRECO}}</span>
    <strong class="num" style="font-size:1.05rem">{{PRECO}}</strong>
  </div>
  <a href="{{CTA_URL}}" class="btn">{{CTA_TEXTO}}</a>
</div>

<script>
// reveal discreto
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12,rootMargin:'0px 0px -40px'});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));

// barra fixa aparece depois do hero
const bar=document.getElementById('bar'), hero=document.querySelector('main > section');
if(bar&&hero){new IntersectionObserver(([e])=>bar.classList.toggle('show',!e.isIntersecting),{threshold:0}).observe(hero);}

// acordeão: um aberto por vez
document.querySelectorAll('.acc').forEach(acc=>{
  acc.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{
    if(d.open) acc.querySelectorAll('details').forEach(o=>{if(o!==d)o.open=false});
  }));
});
</script>
</body>
